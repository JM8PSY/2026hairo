; モーター駆動 ESP32 ファームウェア（親機・子機共通ソース）
; 書き込み: pio run -e child -t upload / pio run -e parent -t upload

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
; test_host/ はホストPC用なのでビルドに含めない（src/ と lib/ だけが対象）

[env:parent]
build_flags = ${env.build_flags} -DBOARD_PARENT

[env:child]
build_flags = ${env.build_flags} -DBOARD_CHILD
